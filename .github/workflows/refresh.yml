name: Refresh dashboard

on:
  schedule:
    # Every Monday at 07:00 UTC. Cron uses UTC regardless of your local time.
    - cron: '0 7 * * 1'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated dashboard back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          python refresh_dashboard.py --summarize
          --out docs/index.html
          --cache-dir /tmp/pdf_cache
          --json-cache dashboard_cache.json
          --newsletter-cache newsletter_history.json

      - name: Commit updated dashboard
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Weekly dashboard refresh"
          file_pattern: 'docs/ dashboard_cache.json newsletter_history.json'
